<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Usuario</title>

  <!-- CSS del proyecto -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Leaflet para el mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- JS del proyecto -->
  <script defer src="/js/menu.js"></script>
  <script defer src="/js/incluirComponentes.js"></script>
  <script defer src="/js/home.js"></script>

  <style>
    main {
      display: flex;
      height: calc(100vh - 50px);
    }

    #map {
      flex: 1;
      height: 100%;
      width: 100%;
    }

    .status-panel {
      width: 250px;
      background: black;
      color: white;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Header dinámico -->
  <div id="componente-header"></div>

  <main>
    <!-- Mapa del dron -->
    <div id="map"></div>

    <!-- Panel de status -->
    <div class="status-panel">
      <div class="status-item">
        <strong>BATERÍA</strong><br><span id="bateria">00%</span>
      </div>
      <div class="status-item">
        <strong>VELOCIDAD</strong><br><span id="velocidad">0.0 kt</span>
      </div>
      <div class="status-item">
        <strong>ALTITUD</strong><br><span id="altitud">0 ft</span>
      </div>
      <div class="status-item">
        <strong>CLIMB RATE</strong><br><span id="climb">0 ft/min</span>
      </div>
      <div class="status-item">
        <strong>VOLTAJE</strong><br><span id="voltaje">0.0 V</span>
      </div>
      <div class="status-item">
        <strong>SATÉLITES</strong><br><span id="satelites">0</span>
      </div>
    </div>
  </main>
</body>
</html>
