<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Cache-Control" content ="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Usuario</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script defer src="/js/menu.js"></script>
  <script defer src="/js/incluirComponentes.js"></script>
</head>
<script>
  window.onload = function() {
    const usuario = localStorage.getItem('usuario');
    if (!usuario) {
      window.location.href = 'index.html';
    }

    window.history.pushState(null, '', window.location.href);
    window.onpopstate = function() {
      window.history.pushState(null, '', window.location.href);
    }
  }
</script>
<body>
  <!-- Aquí se insertará dinámicamente el header y el sidebar -->
  <div id="componente-header"></div>

  <main>
    <div class="map-placeholder">
      <!-- Aquí irá el mapa real en el futuro -->
      <div style="background: #ccc; width: 100%; height: 80vh;">Mapa en tiempo real</div>
    </div>

    <div class="status-panel">
      <p><strong>BATERÍA</strong><br><span>00%</span></p>
      <p><strong>VELOCIDAD</strong><br><span>0.0 km/h</span></p>
      <p><strong>ALTITUD</strong><br><span>0 m/h</span></p>
    </div>
  </main>
</body>
</html>
