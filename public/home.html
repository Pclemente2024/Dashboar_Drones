<!DOCTYPE html>
<html lang="es">

<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Usuario</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script defer src="/js/menu.js"></script>
  <script defer src="/js/incluirComponentes.js"></script>
</head>
<script>
  document.addEventListener('DOMContentLoaded', function () {

    const usuario = localStorage.getItem('usuario');

    if (!usuario) {
      location.replace('/'); // Redirige si no hay usuario
    }


    window.onpageshow = function (event) {
      if (event.persisted) {
        location.reload(); // Si volvió desde caché, recarga para revalidar
      }
    };


    // Si hay usuario, permite el acceso
    window.history.pushState(null, '', window.location.href);
    window.onpopstate = function () {
      window.history.pushState(null, '', window.location.href);
    };

    function cerrarSesion() {
      console.log('Cerrando sesión...');
      localStorage.clear();
      window.location.href = '/';
    }
  });
</script>

<body>
  <!-- Aquí se insertará dinámicamente el header y el sidebar -->
  <div id="componente-header"></div>
  <main>
    <div class="map-placeholder">
      <!-- Mapa real embebido desde Google Maps -->
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d704.8260173444334!2d-79.93873593555946!3d-2.1158831143416417!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x902d73b9f4d745f1%3A0xe1fb4d233e541b99!2sROBIOTEC!5e0!3m2!1ses-419!2sec!4v1749215694700!5m2!1ses-419!2sec"
        allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
    <div class="status-panel">
      <div class="status-item">
        <strong>BATERÍA</strong><br><span>00%</span>
      </div>
      <div class="status-item">
        <strong>VELOCIDAD</strong><br><span>0.0 km/h</span>
      </div>
      <div class="status-item">
        <strong>ALTITUD</strong><br><span>0 m/h</span>
      </div>
    </div>
  </main>
</body>

</html>
